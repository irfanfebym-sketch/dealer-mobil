name: flutter_application_1
description: "halaman login, pendaftaran dan menu."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  get: ^4.6.5
  google_fonts: ^9.0.0
  lottie: ^3.4.0
  fl_chart: ^1.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

